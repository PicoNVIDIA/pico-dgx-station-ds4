<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 404" width="960" height="404" role="img">
<rect x="0.5" y="0.5" width="959" height="403" rx="14" fill="#0d0d0d" stroke="#2b2b2b"/>
<text x="36.0" y="48.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">Where the model lives</text>
<text x="36.0" y="76.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9b9b9b" text-anchor="start">The checkpoint is 510 GB on disk and the GPU holds 250 GiB, so part of it stays in CPU memory.</text>
<rect x="36" y="100" width="540" height="250" rx="10" fill="none" stroke="#ffffff" stroke-width="2"/>
<text x="56.0" y="128.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="2">GPU MEMORY  /  GB300  /  250 GiB</text>
<rect x="56" y="144" width="300" height="186" rx="10" fill="#2e2e2e" stroke="#ffffff" stroke-width="1.5"/>
<text x="76.0" y="226.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">Hot experts</text>
<text x="76.0" y="254.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="start">291 to 302 of 384 per layer</text>
<rect x="372" y="144" width="184" height="58" rx="10" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
<text x="388.0" y="169.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Scratch area</text>
<text x="388.0" y="189.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9b9b" text-anchor="start">shared by all layers</text>
<rect x="372" y="208" width="184" height="58" rx="10" fill="#000000" stroke="#2b2b2b" stroke-width="1.5"/>
<text x="388.0" y="233.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Context cache</text>
<text x="388.0" y="253.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9b9b" text-anchor="start">0.5M to 1.5M tokens</text>
<rect x="372" y="272" width="184" height="58" rx="10" fill="#000000" stroke="#2b2b2b" stroke-width="1.5"/>
<text x="388.0" y="297.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Everything else</text>
<text x="388.0" y="317.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9b9b" text-anchor="start">attention, drafter, head</text>
<rect x="664" y="100" width="260" height="250" rx="10" fill="none" stroke="#2b2b2b" stroke-width="2"/>
<text x="684.0" y="128.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9b9b9b" text-anchor="start" letter-spacing="2">CPU MEMORY  /  494 GiB</text>
<rect x="684" y="144" width="220" height="58" rx="10" fill="#000000" stroke="#9b9b9b" stroke-width="1.5"/>
<text x="700.0" y="169.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Cold experts</text>
<text x="700.0" y="189.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9b9b" text-anchor="start">the other 82 to 93 per layer</text>
<rect x="684" y="216" width="220" height="114" rx="10" fill="#000000" stroke="#2b2b2b" stroke-width="1.5"/>
<text x="700.0" y="266.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Engram tables</text>
<text x="700.0" y="286.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9b9b" text-anchor="start">stay in CPU memory</text>
<line x1="684" y1="173" x2="568" y2="173" stroke="#ffffff" stroke-width="2.5"/>
<polygon points="556,173 570,165 570,181" fill="#ffffff"/>
<text x="620.0" y="160.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">fetch</text>
<text x="36.0" y="382.0" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9b9b9b" text-anchor="start">A fetch sits on the critical path of the step. The recipe is about making fetches rare.</text>
</svg>
